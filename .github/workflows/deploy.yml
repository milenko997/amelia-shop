# Deploys the theme to the live site (ameliashop.rs) on every push to main.
#
# Required repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER      FTP host from the Loopia panel
#   FTP_USERNAME    FTP user
#   FTP_PASSWORD    FTP password
#   FTP_THEME_DIR   theme folder on the server, ending with a slash,
#                   e.g. /public_html/wp-content/themes/amelia-shop/
name: Deploy to live

on:
  push:
    branches: [ main ]
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

# Never run two deploys at the same time; a newer push waits for the running one.
concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Uploads only changed files (tracked in .ftp-deploy-sync-state.json on the server)
      # and removes files that were deleted from the theme.
      - name: Upload theme over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_THEME_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            src/**
            bin/**
            package.json
            package-lock.json
            webpack.config.js
